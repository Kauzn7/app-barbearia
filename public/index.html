<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Barbearia Dedel du Corte - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <p class="marca-eyebrow">Barbearia</p>
    <h1 class="marca-nome">Dedel du Corte</h1>
    <p class="subtitulo">Faça seu cadastro para continuar</p>
  </header>
  <div class="faixa-listrada"></div>

  <form id="form-cadastro">
    <label for="nome">Seu nome:</label>
    <input type="text" id="nome" required>

    <label for="telefone">Telefone (com DDD):</label>
    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" required>

    <button type="submit">Continuar</button>
  </form>

  <script src="cadastro.js"></script>
</body>
</html>
